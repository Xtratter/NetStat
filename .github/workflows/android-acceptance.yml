name: Android emulator acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build emulator APKs
        run: |
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
          export NETSTAT_VPN_CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android29-clang"
          bash tools/build-vpn-native.sh x86_64
          ./gradlew --no-daemon --console=plain assembleDebug
          test_dir="$RUNNER_TEMP/netstat-acceptance"
          mkdir -p "$test_dir"
          keytool -genkeypair -keystore "$test_dir/test.jks" -storepass android -keypass android -alias acceptance \
            -dname "CN=NetStat Emulator Acceptance" -keyalg RSA -keysize 2048 -validity 365
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$test_dir/test.jks" \
            --ks-pass pass:android --out "$test_dir/candidate.apk" app/build/outputs/apk/debug/app-debug.apk
          bash tools/android-acceptance/build-probe.sh "$test_dir"

      - name: Prepare the published 0.6.0 APK for an update test
        run: |
          cd "$RUNNER_TEMP/netstat-acceptance"
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/Xtratter/NetStat/releases/download/v0.6.0/NetStat-0.6.0-debug.apk \
            --output release.apk
          echo "fc0c1f4fecf9e82d2ca28d75d5665a5cf88865f1846aaa0eff547caf1aa0becc  release.apk" | sha256sum -c -
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks test.jks \
            --ks-pass pass:android --out previous.apk release.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify install, update and VPN
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none -no-snapshot
          script: >-
            python3 tools/android-acceptance/check.py
            "$RUNNER_TEMP/netstat-acceptance/previous.apk"
            "$RUNNER_TEMP/netstat-acceptance/candidate.apk"
            "$RUNNER_TEMP/netstat-acceptance/probe-signed.apk"
